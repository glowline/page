<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="google" content="notranslate">
    <title>Glowline</title>
    <link rel="icon" href="favicon.ico" type="image/x-icon">
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #121212;
            color: white;
            font-family: Arial, sans-serif;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            height: 100vh;
            user-select: none;
            overflow: hidden;
            box-sizing: border-box;
        }
        h1 {
            text-align: center;
            margin: 0 10px 10px;
            font-size: clamp(1.5rem, 5vw, 2.5rem);
        }
        .subtitle {
            text-align: center;
            margin: 0 10px 30px;
            font-size: clamp(0.8rem, 3vw, 1rem);
            color: #aaa;
        }
        #image-container {
            max-width: 90%;
            max-height: 70vh;
            width: auto;
            height: auto;
        }
        #image-container img {
            width: 100%;
            height: auto;
            display: block;
        }
    </style>
</head>
<body>
    <h1>Ты на правильном пути!</h1>
    <p class="subtitle">Если здесь не случайно</p>
    <div id="image-container">
        <img id="main-image" src="data/labyrinth.svg" alt="Лабиринт">
    </div>

    <script>
        let clickCount = 0;
        const image = document.getElementById('main-image');

        image.addEventListener('click', function() {
            clickCount++;
            if (clickCount >= 10) {
                image.src = 'data/code.svg';
                clickCount = 0;
            }
        });

        image.addEventListener('touchend', function(e) {
            e.preventDefault();
            clickCount++;
            if (clickCount >= 10) {
                image.src = 'data/code.svg';
                clickCount = 0;
            }
        });
    </script>
</body>
</html>
