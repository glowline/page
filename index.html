<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hello World Page</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #121212;
            color: #ffffff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            
            min-height: 100vh;
            text-align: center;
        }

        h1 {
            font-size: 4rem;
            /* Сделаем текст жирным */
            font-weight: bold;
            margin-bottom: 10px;
            letter-spacing: 1px;
        }

        p {
            font-size: 1.2rem;
            color: #aaaaaa;
            margin-top: 0;
        }

        @media (max-width: 600px) {
            h1 {
                font-size: 2.5rem;
            }
            p {
                font-size: 1rem;
            }
        }
    </style>
</head>
<body>

    <h1>Hello World!</h1>
    <p>Это тестовая веб-страница</p>

</body>
</html>
